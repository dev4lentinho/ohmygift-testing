<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OhMyGiftCard! | Argon Edition - Juegos, Keys y Gift Cards</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#12092b] text-white font-sans antialiased min-h-screen flex flex-col selection:bg-purple-600 selection:text-white">

    <!-- BARRA SUPERIOR CON BOTÓN DE INICIAR SESIÓN / CREAR CUENTA -->
    <div class="bg-[#0d0620] border-b border-purple-900/40 text-xs py-2 px-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-4 text-purple-200">
                <span class="flex items-center gap-1.5 font-medium">
                    <i class="fa-solid fa-earth-americas text-fuchsia-400"></i> Español Latinoamericano | ARS ($)
                </span>
                <span class="hidden md:inline text-purple-700">|</span>
                <span class="hidden md:inline text-purple-300">
                    <i class="fa-solid fa-bolt text-emerald-400 mr-1"></i> Entrega Digital Instantánea Argon Shield
                </span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="hidden sm:inline text-purple-300"><i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i> Protección al Comprador</span>
                <!-- Contenedor dinámico de sesión de usuario -->
                <div id="userNavArea" class="flex items-center">
                    <button onclick="openAuthModal('login')" class="text-white hover:text-fuchsia-300 font-bold transition flex items-center gap-1.5 bg-[#261556] hover:bg-[#321c70] border border-purple-700/70 px-3 py-1 rounded-lg shadow">
                        <i class="fa-regular fa-user text-fuchsia-400"></i>
                        <span>Iniciar sesión | Crear cuenta</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CABECERA PRINCIPAL (TIENDA) -->
    <header id="mainHeader" class="sticky top-0 z-40 bg-[#190d3a]/95 backdrop-blur-md border-b border-purple-800/50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
            <!-- LOGO -->
            <a href="#" onclick="switchView('store')" class="flex items-center space-x-3 group">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-purple-600 via-fuchsia-500 to-amber-400 flex items-center justify-center shadow-lg shadow-purple-900/50 group-hover:scale-105 transition">
